# Ingest worker ONLY. The site itself deploys as a Cloudflare Pages project and gets its
# KV/D1 bindings from the Pages dashboard — the two deployables share the same namespace
# and database but are configured separately.
name = "coinliqui-ingest"
main = "worker/ingest.ts"
compatibility_date = "2026-08-01"

# Every 5 minutes. Network wait does not count toward the 10ms CPU limit; the only CPU
# spent is JSON.parse plus the writes, which is why this fits the free tier.
[triggers]
# TWO CADENCES, ONE WORKER.
#   */5  the full ingest: snapshot, funding history, the chunked candle sweeps, the weekly report.
#   *    spot only, one Coinbase call and one KV write, so a price billed as live is a minute old
#        rather than five. It costs 1,440 light invocations and 1,440 writes a day and touches
#        nothing else — raising the main cron to a minute would have multiplied the D1 funding
#        rows by five to fix a number that has nothing to do with them.
# PHASE-SHIFTED OFF THE ROUND MINUTES, from measurement rather than taste.
# Across 853 recorded runs the failure rate by minute-of-hour is ~29% almost everywhere and
# 58% at :00 and 61% at :30 — roughly double, at exactly the two minutes every other cron on
# the internet fires. Our own sweeps run uniformly on */5 and cannot produce that shape; the
# contention is with everyone else's schedulers, and this Worker shares a Cloudflare egress
# address with them. Two minutes off the boundary keeps the five-minute cadence and steps out
# of the queue. Re-measure by minute-of-hour before concluding anything.
crons = ["2-59/5 * * * *", "* * * * *"]

# IDs are filled in from the dashboard after the namespace and database are created.
# They are identifiers, not secrets: KV and D1 are reachable only through a binding on a
# Worker in this account, so committing them exposes nothing. No token ever goes here —
# secrets belong in `wrangler secret` or the dashboard, never in this file.
[[kv_namespaces]]
binding = "SNAPSHOT"
id = "09d5ddc598f34f36b11d367aac0aad87"

[[d1_databases]]
binding = "DB"
database_name = "coinliqui"
database_id = "04f04034-aa7e-40f4-b993-30ebf191c44a"
migrations_dir = "migrations"
