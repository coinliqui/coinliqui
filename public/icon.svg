<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Coinliqui">
  <!-- Hand-written, no build step, no dependency. Presentation attributes only: this file is
       served verbatim and is also referenced as the Organization logo, where no stylesheet
       will ever reach it. -->
  <rect width="64" height="64" rx="14" fill="#1c1f23"/>
  <!-- The funding curve: the one thing this site is about, drawn rather than lettered. -->
  <path d="M12 44 L24 32 L34 38 L52 18" fill="none" stroke="#8ab4f8" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="52" cy="18" r="5" fill="#8ab4f8"/>
</svg>
